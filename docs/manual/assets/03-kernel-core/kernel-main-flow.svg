  <rect class="bg" width="1300" height="840"/>
  <text class="t" x="30" y="45">kernel.Main boot and runtime loop</text>
  <text class="s" x="30" y="70">Source: kernel/kernel.go lines 27-64</text>

  <rect class="b p1" x="60" y="120" width="240" height="60"/><text class="tx" x="78" y="156">DisableInterrupts</text>
  <rect class="b p1" x="60" y="210" width="240" height="60"/><text class="tx" x="78" y="246">terminal.Init + Clear</text>
