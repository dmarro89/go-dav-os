  <rect class="b p1" x="60" y="570" width="240" height="60"/><text class="tx" x="78" y="606">EnableInterrupts + shell.Init</text>

  <rect class="b p2" x="420" y="180" width="280" height="70"/><text class="tx" x="440" y="220">for { DisableInterrupts }</text>
  <rect class="b p2" x="420" y="290" width="280" height="70"/><text class="tx" x="440" y="330">keyboard.TryRead + EnableInterrupts</text>
  <rect class="b p3" x="780" y="220" width="200" height="70"/><text class="tx" x="800" y="260">if !ok -> Halt</text>
  <rect class="b p3" x="780" y="340" width="250" height="70"/><text class="tx" x="800" y="380">if ok -> shell.FeedRune</text>

